apiVersion: 1

datasources:
  - name: ForgeStream-PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: forgestream_db
    user: forgestream_user
    secureJsonData:
      password: forgestream_secret
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
