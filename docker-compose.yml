version: '3.8'

services:
  # ============================================================================
  # Apache Kafka (KRaft Mode - Single Broker, ZooKeeper-Free)
  # ============================================================================
  kafka:
    image: apache/kafka:latest
    container_name: forgestream-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft Combined Broker & Controller Roles
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single Broker Cluster Replication Settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 5
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # PostgreSQL 16 (Operational Metadata & Data Quality Persistence)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: forgestream-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: forgestream_db
      POSTGRES_USER: forgestream_user
      POSTGRES_PASSWORD: forgestream_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./forgestream/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgestream_user -d forgestream_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
